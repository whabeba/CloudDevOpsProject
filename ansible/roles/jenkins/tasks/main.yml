---
- name: Install the Jenkins repository signing key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: "{{ jenkins_keyring }}"
    mode: "0644"

- name: Add the Jenkins apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ jenkins_keyring }}] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

- name: Configure the Jenkins port and JVM options
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    mode: "0644"
  notify: Restart Jenkins

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start Jenkins
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: true

- name: Wait for the Jenkins UI
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ jenkins_port }}"
    timeout: 300
    delay: 10

- name: Read the initial admin password
  ansible.builtin.slurp:
    src: "{{ jenkins_home }}/secrets/initialAdminPassword"
  register: jenkins_initial_password
  failed_when: false

- name: Print the initial admin password
  ansible.builtin.debug:
    msg: "Jenkins initial admin password: {{ jenkins_initial_password.content | default('') | b64decode }}"
  when: jenkins_initial_password.content is defined
