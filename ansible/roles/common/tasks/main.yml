---
- name: Install common packages and create the admin user
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Create the Jenkins administration user
  ansible.builtin.user:
    name: "{{ jenkins_admin_user }}"
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true

- name: Allow the admin user to run sudo without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ jenkins_admin_user }}"
    content: "{{ jenkins_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
