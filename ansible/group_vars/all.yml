---
jenkins_port: 8080
jenkins_admin_user: jenkins
jenkins_java_opts: "-Djava.awt.headless=true -Xmx1024m"
jenkins_install_recommended_plugins: true

docker_users:
  - jenkins
  - ubuntu

trivy_version: latest

common_packages:
  - ca-certificates
  - curl
  - gnupg
  - unzip
  - git
  - jq
  - python3
  - python3-apt
  - apt-transport-https
  - software-properties-common
