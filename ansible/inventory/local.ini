---
# Static inventory for the local lab.
# The SSH port is the host port Floci published for the EC2 container
# (docker ps -> floci-ec2-* -> 0.0.0.0:22xx->22).
all:
  children:
    jenkins:
      hosts:
        jenkins-local:
          ansible_host: 127.0.0.1
          ansible_port: 2200
          ansible_user: root
          ansible_ssh_private_key_file: ../platform/keys/id_rsa
