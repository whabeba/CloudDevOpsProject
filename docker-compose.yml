name: ivolve

services:
  mysql:
    image: mysql:8.0
    container_name: ivolve-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-ivolve}
      MYSQL_USER: ${DB_USER:-ibrahim}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pass@123}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ivolve-net

  auth-service:
    build:
      context: ./auth-service
    container_name: ivolve-auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ivolve}
      DB_USER: ${DB_USER:-ibrahim}
      DB_PASSWORD: ${DB_PASSWORD:-pass@123}
    ports:
      - "${AUTH_HOST_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ivolve-net

  roadmap-service:
    build:
      context: ./roadmap-service
    container_name: ivolve-roadmap-service
    restart: unless-stopped
    ports:
      - "${ROADMAP_HOST_PORT:-8080}:8080"
    depends_on:
      - auth-service
    networks:
      - ivolve-net

  frontend:
    build:
      context: ./frontend
    container_name: ivolve-frontend
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:5000
      ROADMAP_SERVICE_URL: http://roadmap-service:8080
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-local}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      roadmap-service:
        condition: service_started
    networks:
      - ivolve-net

volumes:
  mysql-data:
    name: ivolve-mysql-data

networks:
  ivolve-net:
    name: ivolve-net
    driver: bridge
