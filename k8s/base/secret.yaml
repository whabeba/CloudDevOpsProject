# Development/demo credentials only.
# In production create this Secret from a secret manager / CI credentials:
#   kubectl -n ivolve create secret generic ivolve-secret \
#     --from-literal=DB_USER=... --from-literal=DB_PASSWORD=... \
#     --from-literal=MYSQL_ROOT_PASSWORD=... --from-literal=SESSION_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: ivolve-secret
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve
type: Opaque
stringData:
  DB_USER: ibrahim
  DB_PASSWORD: "pass@123"
  MYSQL_ROOT_PASSWORD: rootpass
  SESSION_SECRET: change-me-in-k8s
