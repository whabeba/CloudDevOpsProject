apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ivolve
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
spec:
  ingressClassName: nginx
  rules:
    - host: ivolve.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
