apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ivolve
  namespace: ivolve
spec:
  ingressClassName: traefik
  rules:
    - host: ivolve.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
