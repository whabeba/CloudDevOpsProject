apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay.
# Replace 000000000000 with the AWS account id (terraform output / aws sts get-caller-identity).
# Jenkins only rewrites the image tags here, e.g.:
#   kustomize edit set image frontend=000000000000.dkr.ecr.us-east-1.amazonaws.com/frontend:42
namespace: ivolve

resources:
  - ../../base

replicas:
  - name: frontend
    count: 3
  - name: auth-service
    count: 3
  - name: roadmap-service
    count: 3
  - name: mysql
    count: 1

images:
  - name: frontend
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/frontend
    newTag: latest
  - name: auth-service
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/auth-service
    newTag: latest
  - name: roadmap-service
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/roadmap-service
    newTag: latest

patches:
  - path: patch-ingress.yaml
