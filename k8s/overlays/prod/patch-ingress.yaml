apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ivolve
  namespace: ivolve
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
    # Uncomment when cert-manager / an ACM certificate is attached.
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts: [ivolve.example.com]
  #     secretName: ivolve-tls
  rules:
    - host: ivolve.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
